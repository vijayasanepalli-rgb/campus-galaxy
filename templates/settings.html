{% extends "base.html" %}
{% from "_macros.html" import hero with context %}
{% block title %}Settings{% endblock %}
{% block hero %}{{ hero('Settings', 'Update your profile and password.') }}{% endblock %}
{% block content %}
<div class="grid g2">
  <form class="card" method="post">
    <input type="hidden" name="form" value="profile">
    <h3>Profile</h3>
    <label>Name</label><input name="name" value="{{ user['name'] }}" required>
    <label>Email</label><input value="{{ user['email'] }}" disabled>
    <label>Role</label><input value="{{ user['role']|capitalize }}{% if user['roll_no'] %} · {{ user['roll_no'] }}{% endif %}" disabled>
    <label style="display:flex;gap:10px;align-items:center;font-weight:500"><input style="width:auto" type="checkbox" name="notify" {{ 'checked' if user['notify'] }}> Email me about deadlines and alerts</label>
    <button class="btn" style="margin-top:14px">Save profile</button>
  </form>
  <form class="card" method="post">
    <input type="hidden" name="form" value="password">
    <h3>Change password</h3>
    <label>Current password</label><input type="password" name="current" required>
    <label>New password</label><input type="password" name="new" minlength="6" required>
    <button class="btn" style="margin-top:14px">Update password</button>
  </form>
</div>
{% endblock %}
